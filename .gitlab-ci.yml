# Builds the debug APK on every merge request, every push to main, and every
# tag, and keeps it as a downloadable artifact named after the app's
# versionName. Pushing a v* tag (e.g. v1.10.0) also publishes a release.

# Run for merge requests, the default branch, and tags, without a duplicate
# branch pipeline for every push to an open merge request.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

build:
  # The repo has no Gradle wrapper jar, so this uses an image that ships
  # Gradle 8.4. Gradle 8.4 can't run on Java 21, hence JDK 17.
  image: gradle:8.4-jdk17
  variables:
    ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
    # Google's command-line SDK tools, pinned to a build that still has the
    # classic sdkmanager. Newer builds hand it off to the new Android CLI, and
    # Gradle doesn't see licenses accepted that way. Once they're accepted,
    # Gradle downloads the SDK platform and build tools the app needs itself.
    ANDROID_CMDLINE_TOOLS: "13114758"
  cache:
    key:
      files: [build.gradle.kts, app/build.gradle.kts]
    paths: [.android-sdk/, .gradle-home/caches/]
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl unzip > /dev/null
    - |
      if [ ! -x "$ANDROID_HOME/cmdline-tools/$ANDROID_CMDLINE_TOOLS/bin/sdkmanager" ]; then
        curl -sSfL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS}_latest.zip"
        unzip -q /tmp/cmdline-tools.zip -d /tmp
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        mv /tmp/cmdline-tools "$ANDROID_HOME/cmdline-tools/$ANDROID_CMDLINE_TOOLS"
      fi
    - (yes || true) | "$ANDROID_HOME/cmdline-tools/$ANDROID_CMDLINE_TOOLS/bin/sdkmanager" --licenses > /dev/null
  script:
    # Without app/signing.p12 (never committed), the build falls back to the
    # standard debug key.
    - gradle assembleDebug --no-daemon --stacktrace
    - VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
    - cp app/build/outputs/apk/debug/app-debug.apk "auto-lyrics-$VERSION.apk"
    - echo "VERSION=$VERSION" > version.env
  artifacts:
    name: "auto-lyrics-$CI_COMMIT_SHORT_SHA"
    paths: [auto-lyrics-*.apk]
    reports:
      dotenv: version.env  # hands VERSION to the release job
    expire_in: 30 days

# Publishes a GitLab release for a v* tag. The APK goes into the project's
# package registry, which (unlike job artifacts) never expires, and the
# release links to it, with the commits since the previous tag as its notes.
release:
  stage: deploy
  image: alpine:3.22
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs: [build]
  variables:
    GIT_DEPTH: "0"  # full history, for the release notes
  before_script:
    - apk add --no-cache --quiet curl git jq
  script:
    - |
      if [ "$CI_COMMIT_TAG" != "v$VERSION" ]; then
        echo "Tag $CI_COMMIT_TAG doesn't match versionName $VERSION in app/build.gradle.kts, so nothing was released."
        exit 1
      fi
    - FILE="auto-lyrics-$VERSION.apk"
    - PACKAGE_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/auto-lyrics/$VERSION/$FILE"
    - 'curl --fail-with-body --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$FILE" "$PACKAGE_URL"'
    - git fetch --quiet --tags origin
    - PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' "$CI_COMMIT_TAG^" 2>/dev/null || true)
    - |
      {
        echo "Debug build of Auto Lyrics $VERSION. Each CI build is signed with a fresh debug key, so uninstall any earlier build before installing this one."
        if [ -n "$PREVIOUS" ]; then
          printf '\n## Changes since %s\n\n' "$PREVIOUS"
          git log --no-merges --format='- %s' "$PREVIOUS..$CI_COMMIT_TAG"
        fi
      } > notes.md
    - |
      jq -n --arg tag "$CI_COMMIT_TAG" --arg name "Auto Lyrics $VERSION" --rawfile notes notes.md \
            --arg file "$FILE" --arg url "$PACKAGE_URL" \
        '{tag_name: $tag, name: $name, description: $notes,
          assets: {links: [{name: $file, url: $url, direct_asset_path: ("/" + $file), link_type: "package"}]}}' \
      | curl --fail-with-body --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --header "Content-Type: application/json" --data @- "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
